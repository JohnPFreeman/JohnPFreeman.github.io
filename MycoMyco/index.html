<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>MycoMyco</title>

	<!-- Home screen: "Add to Home Screen" picks these up when this page is the one being saved. -->
	<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="MycoMyco">
	<meta name="theme-color" content="#000000">

	<style>
		html,
		body {
			background: #000;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			/* Touches belong to the game: no scrolling, pull-to-refresh, pinch zoom or text selection. */
			overscroll-behavior: none;
			touch-action: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
		}

		#unity-canvas {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			touch-action: none;
			outline: none;
		}

		/* The loading bar: a chunky track that fills with fungus, with the player running on its leading edge */
		#loading {
			position: fixed;
			left: 20%;
			right: 20%;
			top: 50%;
			height: 32px;
			margin-top: -16px;
		}

		#loading-bar {
			position: absolute;
			inset: 0;
			border: 5px solid #fff;
			background: #1a1a1a;
			overflow: hidden;
		}

		#loading-fill {
			width: 0%;
			height: 100%;
			background: url("loading-fungus.png") repeat;
			background-size: 32px 32px;
			image-rendering: pixelated;
		}

		/* Three 64 px walk frames shown at their real size so every pixel is even, stepping through them at the game's own 12 fps.
		   The four stacked shadows add up to a square 5 px white outline, the same as the bar's border */
		#loading-runner {
			position: absolute;
			left: 0%;
			top: 50%;
			width: 64px;
			height: 64px;
			transform: translate(-50%, -50%);
			background: url("loading-runner.png") no-repeat 0 0;
			background-size: 192px 64px;
			image-rendering: pixelated;
			filter: drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff);
			animation: loading-run 0.25s steps(3) infinite;
			pointer-events: none;
		}

		@keyframes loading-run {
			from { background-position: 0 0; }
			to { background-position: -192px 0; }
		}

		/* The game only makes sense sideways, so ask phones held upright to rotate. */
		#rotate-prompt {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 10;
			background: #000;
			color: #fff;
			font-family: sans-serif;
			font-size: 1.4rem;
			text-align: center;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.5rem;
		}

		#rotate-prompt img {
			width: 40vw;
			max-width: 220px;
			animation: tilt 1.6s ease-in-out infinite;
		}

		@keyframes tilt {
			0%, 20% { transform: rotate(0deg); }
			50%, 70% { transform: rotate(-90deg); }
			100% { transform: rotate(0deg); }
		}

		@media (orientation: portrait) and (pointer: coarse) {
			#rotate-prompt {
				display: flex;
			}
		}
	</style>
</head>

<body>
	<canvas id="unity-canvas" tabindex="-1"></canvas>
	<div id="loading">
		<div id="loading-bar"><div id="loading-fill"></div></div>
		<div id="loading-runner"></div>
	</div>
	<div id="rotate-prompt">
		<img src="icon-512.png" alt="">
		<div>Turn your phone sideways</div>
	</div>

	<script src="Build/MycoMyco_v1.3.0.loader.js"></script>
	<script>
		var canvas = document.querySelector("#unity-canvas");
		var loading = document.querySelector("#loading");
		var loadingFill = document.querySelector("#loading-fill");
		var loadingRunner = document.querySelector("#loading-runner");

		var config = {
			dataUrl: "Build/MycoMyco_v1.3.0.data.unityweb",
			frameworkUrl: "Build/MycoMyco_v1.3.0.framework.js.unityweb",
			codeUrl: "Build/MycoMyco_v1.3.0.wasm.unityweb",
			streamingAssetsUrl: "StreamingAssets",
			companyName: "DefaultCompany",
			productName: "MycoMyco",
			productVersion: "1.0",
			autoSyncPersistentDataPath: true,
			// Phones report up to 3x pixel density; 2x is plenty for this game and much lighter to render.
			devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
		};

		createUnityInstance(canvas, config, function (progress) {
			loadingFill.style.width = (progress * 100) + "%";
			loadingRunner.style.left = (progress * 100) + "%";
		}).then(function () {
			loading.remove();
		}).catch(function (message) {
			alert(message);
		});

		// Go fullscreen and lock to landscape on the first tap. Browsers only allow this from a user gesture, and
		// some (Safari on iPhone) don't support it at all, so every step is optional.
		function enterFullscreenLandscape() {
			var root = document.documentElement;
			var request = root.requestFullscreen || root.webkitRequestFullscreen;
			if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
				Promise.resolve(request.call(root)).then(function () {
					if (screen.orientation && screen.orientation.lock) {
						return screen.orientation.lock("landscape");
					}
				}).catch(function () { });
			}
		}

		if (matchMedia("(pointer: coarse)").matches) {
			window.addEventListener("pointerup", enterFullscreenLandscape, { once: true });
		}
	</script>
</body>

</html>
